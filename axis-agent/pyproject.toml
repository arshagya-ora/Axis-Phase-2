[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "axis-agent"
version = "0.1.0"
description = "Security-first Python control plane for AXIS browser automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "aiosqlite>=0.22,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "typer>=0.22,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<0.16",
]
agent = [
  "httpx==0.28.1",
  "mcp==1.28.1",
  "oci-genai-auth==1.1.1",
  "openai==2.45.0",
]
browser = ["playwright==1.62.0"]

[project.scripts]
axis-agent = "axis_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/axis_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".axis-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite"]
ignore_missing_imports = true
